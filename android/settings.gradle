pluginManagement {
    resolutionStrategy { eachPlugin { if (requested.id.id == 'com.android.application') useModule("com.android.tools.build:gradle:${requested.version}") } }
    repositories { maven { url 'https://maven.aliyun.com/repository/google' }; maven { url 'https://maven.aliyun.com/repository/public' }; google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'StudyTime'
include ':app'
