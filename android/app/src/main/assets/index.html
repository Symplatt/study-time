<div class="app">
  <main>
    <section id="home-view">
      <div class="page-heading"><div><button class="date-button" id="date-button" aria-haspopup="dialog"><h1 id="date-title"></h1><span data-icon="chevron"></span></button><p id="date-caption" class="muted"></p></div><button class="today-button" id="today-button" hidden>回到今天</button><span class="date-stamp" id="date-stamp"></span></div>

      <section class="timer-card" aria-label="学习计时器"><div class="timer-heading"><span class="section-tag">学习计时</span><span id="timer-state"><i></i>准备开始</span></div><div class="timer-orbit"><svg class="orbit" viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="126"/><circle class="orbit-progress" cx="140" cy="140" r="126"/></svg><div class="timer-face"><span class="timer-label" id="timer-label">本次时长</span><div id="timer-digits" role="timer" aria-label="本次学习时长">00:00:00</div></div><span class="orbit-leaf" data-icon="leaf"></span></div><div class="timer-controls"><button id="start-button" class="control start"><span data-icon="play"></span>开始</button><button id="pause-button" class="control secondary" disabled><span data-icon="pause"></span><span id="pause-label">暂停</span></button><button id="finish-button" class="control secondary" disabled><span data-icon="stop"></span>结束</button></div><p class="timer-footnote">暂停可暂时停止计时，结束后保存本次记录</p></section>

    </section>
    <section id="stats-view" hidden><div class="page-heading"><div><h1>学习统计</h1></div><span class="stats-emblem" data-icon="chart"></span></div><div class="period-tabs" role="tablist" aria-label="统计时间范围"><button role="tab" aria-selected="true" data-period="week">近一周</button><button role="tab" aria-selected="false" data-period="month">近一个月</button><button role="tab" aria-selected="false" data-period="year">近一年</button></div><section class="chart-card"><div class="section-heading"><h2>专注时长</h2><span id="chart-unit" class="muted">单位：分钟</span></div><div class="chart-total" id="stats-total"></div><p class="muted" id="stats-range"></p><div class="chart-area"><div class="chart-grid" id="chart-grid"></div><div id="chart-bars" class="chart-bars" aria-label="学习时长柱状图"></div></div><div class="chart-labels" id="chart-labels"></div><p class="chart-detail" id="chart-detail" aria-live="polite">点击柱形，查看详细记录</p></section><div class="stats-grid"><div class="stat-card"><span data-icon="sun"></span><p>日均学习</p><strong id="stats-average"></strong></div><div class="stat-card"><span data-icon="book"></span><p>专注次数</p><strong id="stats-sessions"></strong></div><div class="stat-card"><span data-icon="calendar"></span><p>学习天数</p><strong id="stats-days"></strong></div><div class="stat-card"><span data-icon="trophy"></span><p id="best-label">单日最佳</p><strong id="stats-best"></strong><small id="best-date"></small></div></div></section>
    <section id="settings-view" hidden aria-labelledby="settings-title"><div class="page-heading"><h1 id="settings-title">设置</h1><span class="stats-emblem" data-icon="settings"></span></div><section class="settings-card" aria-labelledby="data-title"><div class="section-heading"><h2 id="data-title">数据管理</h2></div><p class="data-description">导出将 JSON 数据复制到剪切板，可粘贴保存为 .json 文件备份；导入时选择备份文件。</p><div class="data-actions"><button id="export-button" class="full-button"><span data-icon="upload"></span>导出数据</button><button id="import-button" class="full-button"><span data-icon="download"></span>导入数据</button></div><p class="data-note">仅导出已结束的记录；进行中的计时请先结束。导入会合并记录，重复项不会重复添加。</p><input id="import-file" type="file" accept=".json,application/json,text/plain" hidden><section id="import-preview" hidden><h3>导入预览</h3><p id="import-summary"></p><p class="data-note" id="import-conflicts"></p><div class="data-actions"><button id="cancel-import" class="full-button secondary">取消</button><button id="confirm-import" class="full-button">确认导入</button></div></section></section></section>

<script>(function (root) {
  'use strict';
  const dateKey = (time) => { const d = new Date(time); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const localDate = key => new Date(`${key}T00:00:00`);
  const initial = () => ({version:1, records:[], active:null});
  function start(state, now) {
    if (state.active) return state;
    return {...state, active:{id:`${now}`, started:now, since:now, segments:[]}};
  }
  function toggle(state, now) {
    if (!state.active) return state;
    const a = state.active;
    return {...state,active:a.since !== null ? {...a,since:null,segments:[...a.segments,[a.since,Math.max(a.since,now)]]} : {...a,since:now}};
  }
  const segments = (a,now) => !a ? [] : [...a.segments,...(a.since !== null ? [[a.since,Math.max(a.since,now)]] : [])];
  const duration = (a,now) => segments(a,now).reduce((n,[s,e])=>n+e-s,0);
  function finish(state,now) {
    if (!state.active) return state;
    const record = {...state.active, since:null, ended:now, segments:segments(state.active,now)};
    return {...state,active:null,records:[...state.records,record]};
  }
  function split(record, now) {
    const days = new Map();
    for (const [start,end] of segments(record,now)) {
      let cursor = start;
      while (cursor < end) {
        const d = new Date(cursor); d.setHours(24,0,0,0);
        const edge = Math.min(end,d.getTime()), key = dateKey(cursor);
        const row = days.get(key) || {id:record.id,date:key,ms:0,start:cursor,end:edge,active:!record.ended};
        row.ms += edge-cursor; row.end = edge; days.set(key,row); cursor = edge;
      }
    }
    return [...days.values()];
  }
  const rows = (state,now) => [...state.records,...(state.active ? [state.active] : [])].flatMap(r=>split(r,now));
  function buckets(state,period,now) {
    const today = new Date(now); today.setHours(0,0,0,0);
    const count = period === 'week' ? 7 : period === 'month' ? 30 : 12;
    const result = Array.from({length:count},(_,i)=>{
      const date = new Date(today);
      if (period === 'year') {date.setDate(1);date.setMonth(date.getMonth()-(count-1-i));}
      else date.setDate(date.getDate()-(count-1-i));
      const key = dateKey(date);
      return {key:period === 'year'?key.slice(0,7):key,ms:0,count:0,label:period === 'year'?`${date.getMonth()+1}月`:`${date.getMonth()+1}/${date.getDate()}`};
    });
    const start = period === 'year' ? `${result[0].key}-01` : result[0].key;
    const validRows = rows(state,now).filter(r=>r.date>=start && r.date<=dateKey(now));
    for (const row of validRows) {const b=result.find(b=>b.key===(period==='year'?row.date.slice(0,7):row.date));if(b){b.ms+=row.ms;b.count++;}}
    const days = Math.round((today-localDate(start))/86400000)+1;
    return {buckets:result,total:validRows.reduce((n,r)=>n+r.ms,0),sessions:new Set(validRows.map(r=>r.id)).size,activeDays:new Set(validRows.filter(r=>r.ms>0).map(r=>r.date)).size,days};
  }
  function validState(s) {
    const segment = p => Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&p[1]>=p[0];
    const record = r=>r&&typeof r.id==='string'&&Number.isFinite(r.started)&&Array.isArray(r.segments)&&r.segments.every(segment)&&(r.since===null||Number.isFinite(r.since));
    return s&&s.version===1&&Array.isArray(s.records)&&s.records.every(r=>record(r)&&Number.isFinite(r.ended)&&r.since===null)&&(s.active===null||record(s.active));
  }
  function exportBackup(state,now) {
    return JSON.stringify({format:'shishi-backup',version:1,exportedAt:new Date(now).toISOString(),records:state.records},null,2);
  }
  function parseBackup(text) {
    if(typeof text!=='string'||text.length>10*1024*1024) throw Error('备份文件不能超过 10 MB');
